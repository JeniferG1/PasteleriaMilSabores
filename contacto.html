<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link  rel="stylesheet" href="Proyecto.css">
    <title>Pastelería Mil Sabores - Contacto</title>
</head>
<body>
    
  <header class="site-header">
    <div class="logo">
      <img src="Mil sabores.png" alt="Logo Pastelería Mil Sabores">
      <span class="logo-text">Pastelería Mil Sabores</span>
    </div>
 
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html" class="active">Contacto</a></li>
      </ul>
    </nav>
 
    <div class="header-actions">
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html">Registrarse</a>
      <a href="carrito.html" class="cart-link">🛒 Carrito (<span id="cart-count">0</span>)</a>
    </div>
  </header>
 
  <main class="pagina-centrada">
    <div class="logo-centrado">
      <img src="Mil sabores.png" alt="Logo Pastelería Mil Sabores">
      <h1>Pastelería Mil Sabores</h1>
    </div>
 
    <section class="form-section">
      <form id="form-contacto" class="form-tarjeta" novalidate>
        <h2>Formulario de contacto</h2>
 
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required maxlength="100">
          <span class="mensaje-error" id="error-nombre"></span>
        </div>
 
        <div class="campo">
          <label for="correo">Correo (opcional)</label>
          <input type="email" id="correo" name="correo" maxlength="100">
          <span class="mensaje-error" id="error-correo"></span>
        </div>
 
        <div class="campo">
          <label for="comentario">Comentario</label>
          <textarea id="comentario" name="comentario" rows="5" required maxlength="500"></textarea>
          <span class="mensaje-error" id="error-comentario"></span>
        </div>
 
        <button type="submit" class="btn-primary">Enviar mensaje</button>
      </form>
    </section>
  </main>
 
  <footer class="site-footer">
    <p class="copyright">&copy; 2026 Pastelería Mil Sabores. Todos los derechos reservados.</p>
  </footer>
 
  <script src="js/datos.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
