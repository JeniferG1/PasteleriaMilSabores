<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link  rel="stylesheet" href="Proyecto.css">
    <title>Pastelería Mil Sabores - Iniciar Sesión</title>
</head>
<body>
    
  <header class="site-header">
    <div class="logo">
      <img src="Mil sabores1.png" alt="Logo Pastelería Mil Sabores">
      <span class="logo-text">Pastelería Mil Sabores</span>
    </div>
 
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
 
    <div class="header-actions">
      <a href="carrito.html" class="cart-link">🛒 Carrito (<span id="cart-count">0</span>)</a>
    </div>
  </header>
 
  <main class="pagina-centrada">
    <div class="logo-centrado">
      <img src="Mil sabores.png" alt="Logo Pastelería Mil Sabores">
      <h1>Pastelería Mil Sabores</h1>
    </div>
 
    <section class="form-section">
      <form id="form-login" class="form-tarjeta" novalidate>
        <h2>Inicio de sesión</h2>
 
        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" required maxlength="100">
          <span class="mensaje-error" id="error-correo"></span>
        </div>
 
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required minlength="4" maxlength="10">
          <span class="mensaje-error" id="error-contrasena"></span>
        </div>
 
        <button type="submit" class="btn-primary">Iniciar sesión</button>
 
        <p class="enlace-secundario">
          ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </p>
      </form>
    </section>
  </main>
 
  <footer class="site-footer">
    <p class="copyright">&copy; 2026 Pastelería Mil Sabores. Todos los derechos reservados.</p>
  </footer>
 
  <script src="js/datos.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
