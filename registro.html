<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link  rel="stylesheet" href="Proyecto.css">
    <title>Registro - Pastelería Mil Sabores</title>
</head>
<body>
    <header class="site-header">
    <div class="logo">
      <img src="Mil sabores1.png" alt="Logo Pastelería Mil Sabores">
      <span class="logo-text">Pastelería Mil Sabores</span>
    </div>
 
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
 
    <div class="header-actions">
      <a href="carrito.html" class="cart-link">🛒 Carrito (<span id="cart-count">0</span>)</a>
    </div>
  </header>
 
  <main>
    <section class="form-section">
      <h1>Registro de usuario</h1>
 
      <form id="form-registro" class="form-tarjeta" novalidate>
 
        <div class="campo">
          <label for="run">RUN</label>
          <input type="text" id="run" name="run" placeholder="Ej: 19011022K" required minlength="7" maxlength="9">
          <span class="mensaje-error" id="error-run"></span>
        </div>
 
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required maxlength="50">
          <span class="mensaje-error" id="error-nombre"></span>
        </div>
 
        <div class="campo">
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" name="apellidos" required maxlength="100">
          <span class="mensaje-error" id="error-apellidos"></span>
        </div>
 
        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" required maxlength="100">
          <span class="mensaje-error" id="error-correo"></span>
        </div>
 
        <div class="campo">
          <label for="confirmar-correo">Confirmar correo</label>
          <input type="email" id="confirmar-correo" name="confirmar-correo" required maxlength="100">
          <span class="mensaje-error" id="error-confirmar-correo"></span>
        </div>
 
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required minlength="4" maxlength="10">
          <span class="mensaje-error" id="error-contrasena"></span>
        </div>
 
        <div class="campo">
          <label for="confirmar-contrasena">Confirmar contraseña</label>
          <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" required minlength="4" maxlength="10">
          <span class="mensaje-error" id="error-confirmar-contrasena"></span>
        </div>
 
        <div class="campo">
          <label for="fecha-nacimiento">Fecha de nacimiento (opcional)</label>
          <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
        </div>
 
        <div class="campo-doble">
          <div class="campo">
            <label for="region">Región</label>
            <select id="region" name="region" required>
              <option value="">-- Seleccione la región --</option>
              <option value="metropolitana">Región Metropolitana de Santiago</option>
              <option value="araucania">Región de la Araucanía</option>
              <option value="nuble">Región de Ñuble</option>
            </select>
          </div>
 
          <div class="campo">
            <label for="comuna">Comuna</label>
            <select id="comuna" name="comuna" required>
              <option value="">-- Seleccione la comuna --</option>
            </select>
          </div>
        </div>
 
        <div class="campo">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" name="direccion" required maxlength="300">
          <span class="mensaje-error" id="error-direccion"></span>
        </div>
 
        <div class="campo">
          <label for="codigo-promocional">Código promocional (opcional)</label>
          <input type="text" id="codigo-promocional" name="codigo-promocional" placeholder="Ej: FELICES50">
        </div>
 
        <button type="submit" class="btn-primary">Registrar</button>
      </form>
    </section>
  </main>
 
  <footer class="site-footer">
    <p class="copyright">&copy; 2026 Pastelería Mil Sabores. Todos los derechos reservados.</p>
  </footer>
 
  <script src="js/datos.js"></script>
  <script src="js/regiones-comunas.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
